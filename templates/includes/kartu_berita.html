{% load static %}
<article class="card-tilt group bg-white rounded-3xl border border-neutral-200/80 overflow-hidden shadow-sm hover:shadow-2xl hover:border-neutral-300 transition-all duration-300 flex flex-col h-full transform-gpu">
    <div class="relative aspect-[16/10] overflow-hidden bg-neutral-100">
        {% if item.gambar_sampul %}
            <img src="{{ item.gambar_sampul.url }}" alt="{{ item.judul }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        {% else %}
            <div class="w-full h-full flex items-center justify-center bg-brand-900/10 text-brand-800">
                <img src="{% static 'images/muhammadiyah.svg' %}" alt="Logo" class="w-16 h-16 opacity-30">
            </div>
        {% endif %}
        <div class="absolute top-4 left-4">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-semibold bg-white/90 backdrop-blur-md text-neutral-800 shadow-sm">
                {{ item.tanggal_terbit|date:"d M Y" }}
            </span>
        </div>
    </div>
    <div class="p-6 flex flex-col flex-grow justify-between">
        <div class="space-y-3">
            <h3 class="font-bold text-lg text-neutral-950 group-hover:text-brand-800 transition-colors leading-snug line-clamp-2">
                <a href="{{ item.get_absolute_url }}">
                    {{ item.judul }}
                </a>
            </h3>
            <p class="text-sm text-neutral-600 line-clamp-3 leading-relaxed">
                {{ item.ringkasan }}
            </p>
        </div>
        <div class="pt-5 mt-4 border-t border-neutral-100 flex items-center justify-between text-xs font-semibold">
            <span class="text-brand-800 uppercase tracking-wider group-hover:translate-x-1 transition-transform inline-flex items-center gap-1">
                Baca Selengkapnya &rarr;
            </span>
            <span class="text-neutral-400 font-normal inline-flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                {{ item.estimasi_waktu_baca }}
            </span>
        </div>
    </div>
</article>
