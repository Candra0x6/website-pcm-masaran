services:
  - type: web
    name: website-pcm-masaran
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: pcm-masaran-db
          property: connectionString

databases:
  - name: pcm-masaran-db
    plan: free
    region: singapore
    databaseName: pcm_masaran_db
    user: pcm_user
